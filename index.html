<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог из 16 игр</title>
  <style>
    :root {
      --bg: #faf7f5;
      --surface: #ffffff;
      --surface-soft: #fdf8f7;
      --border: #eadcd9;
      --border-strong: #d8b4b0;
      --text: #261618;
      --muted: #6e5558;
      --bordeaux: #7c1d2b;
      --bordeaux-dark: #5e131e;
      --bordeaux-tint: #f8ecee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #fdfafa 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.5;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 36px 18px 64px;
    }

    header.hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 4px solid var(--bordeaux);
      border-radius: 16px;
      padding: 24px 26px;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(94, 19, 30, 0.05);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--bordeaux);
      background: var(--bordeaux-tint);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: var(--text);
    }

    .sub {
      color: var(--muted);
      margin: 0;
      font-size: 15px;
    }

    .games-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 4px 14px rgba(94, 19, 30, 0.04);
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .game-row:hover {
      transform: translateY(-1px);
      border-color: var(--border-strong);
      box-shadow: 0 8px 20px rgba(94, 19, 30, 0.08);
    }

    .game-num {
      font-size: 12px;
      color: var(--bordeaux);
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .game-title {
      font-size: 18px;
      font-weight: 700;
      margin: 3px 0 4px;
      color: var(--text);
    }

    .game-desc {
      font-size: 14px;
      color: var(--muted);
      margin: 0;
    }

    .play-btn {
      flex-shrink: 0;
      text-decoration: none;
      background: var(--bordeaux);
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid var(--bordeaux-dark);
      transition: background-color 0.15s ease;
    }

    .play-btn:hover {
      background: var(--bordeaux-dark);
    }

    @media (max-width: 600px) {
      .game-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .play-btn {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="badge">Коллекция из 16 игр</div>
      <h1>Интерактивные игры</h1>
      <p class="sub">Игры идут друг за другом — выберите нужную и откройте её в браузере.</p>
    </header>

    <div class="games-list" id="gamesList"></div>
  </div>

  <script>
    const games = [
      { file: "game-1.html", title: "Игра 1", desc: "Описание первой игры" },
      { file: "game-2.html", title: "Игра 2", desc: "Описание второй игры" },
      { file: "game-3.html", title: "Игра 3", desc: "Описание третьей игры" },
      { file: "game-4.html", title: "Игра 4", desc: "Описание четвертой игры" },
      { file: "game-5.html", title: "Инженерное бюро: квадратные уравнения", desc: "Задачи с моделями, дискриминантом, симуляцией и графиком" },
      { file: "game-6.html", title: "Игра 6", desc: "Описание шестой игры" },
      { file: "game-7.html", title: "Игра 7", desc: "Описание седьмой игры" },
      { file: "game-8.html", title: "Игра 8", desc: "Описание восьмой игры" },
      { file: "game-9.html", title: "Игра 9", desc: "Описание девятой игры" },
      { file: "game-10.html", title: "Игра 10", desc: "Описание десятой игры" },
      { file: "game-11.html", title: "Игра 11", desc: "Описание одиннадцатой игры" },
      { file: "game-12.html", title: "Игра 12", desc: "Описание двенадцатой игры" },
      { file: "game-13.html", title: "Игра 13", desc: "Описание тринадцатой игры" },
      { file: "game-14.html", title: "Игра 14", desc: "Описание четырнадцатой игры" },
      { file: "game-15.html", title: "Игра 15", desc: "Описание пятнадцатой игры" },
      { file: "game-16.html", title: "Игра 16", desc: "Описание шестнадцатой игры" }
    ];

    const container = document.getElementById("gamesList");
    container.innerHTML = games.map((g, idx) => `
      <div class="game-row">
        <div>
          <div class="game-num">ИГРА ${idx + 1}</div>
          <div class="game-title">${g.title}</div>
          <p class="game-desc">${g.desc}</p>
        </div>
        <a class="play-btn" href="${g.file}">Открыть</a>
      </div>
    `).join("");
  </script>
</body>
</html>
