<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог из 16 игр</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      line-height: 1.5;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 28px 18px 60px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .sub {
      color: #94a3b8;
      margin: 0 0 28px;
    }
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .game-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px 20px;
    }
    .game-num {
      font-size: 13px;
      color: #38bdf8;
      font-weight: 700;
    }
    .game-title {
      font-size: 18px;
      font-weight: 600;
      margin: 2px 0;
    }
    .game-desc {
      font-size: 14px;
      color: #94a3b8;
      margin: 0;
    }
    .play-btn {
      flex-shrink: 0;
      text-decoration: none;
      background: #38bdf8;
      color: #06202e;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
    }
    .play-btn:hover {
      filter: brightness(1.1);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>16 интерактивных игр</h1>
    <p class="sub">Выберите игру из списка ниже — она откроется в браузере.</p>

    <div class="games-list" id="gamesList"></div>
  </div>

  <script>
    const games = [
      { file: "game-1.html", title: "game 1", desc: "Описание первой игры" },
      { file: "game-2.html", title: "game 2", desc: "Описание второй игры" },
      { file: "game-3.html", title: "game 3", desc: "Описание третьей игры" },
      { file: "game-4.html", title: "game 4", desc: "Описание четвертой игры" },
      { file: "game-5.html", title: "game 5", desc: "Задачи с моделями, дискриминантом, симуляцией и графиком" },
      { file: "game-6.html", title: "game 6", desc: "Описание шестой игры" },
      { file: "game-7.html", title: "game 7", desc: "Описание седьмой игры" },
      { file: "game-8.html", title: "game 8", desc: "Описание восьмой игры" },
      { file: "game-9.html", title: "game 9", desc: "Описание девятой игры" },
      { file: "game-10.html", title: "game 10", desc: "Описание десятой игры" },
      { file: "game-11.html", title: "game 11", desc: "Описание одиннадцатой игры" },
      { file: "game-12.html", title: "game 12", desc: "Описание двенадцатой игры" },
      { file: "game-13.html", title: "game 13", desc: "Описание тринадцатой игры" },
      { file: "game-14.html", title: "game 14", desc: "Описание четырнадцатой игры" },
      { file: "game-15.html", title: "game 15", desc: "Описание пятнадцатой игры" },
      { file: "game-16.html", title: "game 16", desc: "Описание шестнадцатой игры" }
    ];

    const container = document.getElementById("gamesList");
    container.innerHTML = games.map((g, idx) => `
      <div class="game-row">
        <div>
          <div class="game-num">ИГРА ${idx + 1}</div>
          <div class="game-title">${g.title}</div>
          <p class="game-desc">${g.desc}</p>
        </div>
        <a class="play-btn" href="${g.file}">Открыть</a>
      </div>
    `).join("");
  </script>
</body>
</html>
